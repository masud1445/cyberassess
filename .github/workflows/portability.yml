name: Portability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install constrained dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Validate POSIX installer syntax
        if: runner.os != 'Windows'
        shell: bash
        run: sh -n install.sh
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'install.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Parse Windows collector scripts without running security queries
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $capture = @'
          import json
          import subprocess
          from cyberassess.collectors.windows import WindowsCollector
          commands = []
          def capture(command, **kwargs):
              commands.append(command[-1])
              return subprocess.CompletedProcess(command, 1, b'')
          WindowsCollector(runner=capture).collect()
          print(json.dumps(commands))
          '@
          $scripts = $capture | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($script in ($scripts | ConvertFrom-Json)) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseInput(
              [string]$script, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - name: Run assessment, CLI and collector tests
        run: python -m pytest -q
      - name: Check portability from outside the checkout
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/scripts/check_portability.py"
